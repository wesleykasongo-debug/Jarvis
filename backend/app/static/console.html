<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Console</title>
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6760;
    --line: #e2ded5;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --user: #ece8df;
    --ok: #2f7d4f;
    --warn: #b7791f;
    --err: #b83a3a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1e1e1c; --ink: #ecebe6; --muted: #9c988f;
      --line: #33322f; --accent: #7fb8a4; --accent-ink: #10201b; --user: #2a2a27;
      --ok: #6cc08f; --warn: #e0a84a; --err: #e57373;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1e1e1c; --ink: #ecebe6; --muted: #9c988f;
    --line: #33322f; --accent: #7fb8a4; --accent-ink: #10201b; --user: #2a2a27;
    --ok: #6cc08f; --warn: #e0a84a; --err: #e57373;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
    padding: 18px 16px 14px; border-bottom: 1px solid var(--line);
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  h1 { font: 600 22px/1 var(--serif); letter-spacing: .18em; margin: 0; }
  h1 small { font: 12px var(--sans); letter-spacing: .08em; color: var(--muted); margin-left: 8px; text-transform: uppercase; }
  .status { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.warn { background: var(--warn); }

  main { flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%; margin: 0 auto; padding: 0 16px; min-height: 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  #login { max-width: 380px; margin: 48px auto; width: 100%; }
  #login p { color: var(--muted); margin: 0 0 6px; font-size: 13px; }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: -4px 0 18px; }
  button.tab {
    background: none; color: var(--muted); border-radius: 0; padding: 0 0 10px; margin-bottom: -1px;
    font: 500 19px var(--serif); border-bottom: 2px solid transparent;
  }
  button.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .notice { color: var(--ok); font-size: 13px; margin-top: 12px; white-space: pre-wrap; }
  .notice:empty, .error:empty { display: none; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; letter-spacing: .04em; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: 500 14px var(--sans); border: 0; border-radius: 7px; padding: 9px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #login button { width: 100%; margin-top: 18px; }
  .error { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 1em; white-space: pre-wrap; }

  #chat { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted);
  }
  .toolbar select { width: auto; padding: 5px 8px; font-size: 13px; }
  .toolbar .grow { flex: 1; }
  .quota { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .bar { width: 72px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--muted); transition: width .6s cubic-bezier(.2,.8,.2,1), background .3s; }
  .conv { font: 11px var(--mono); }

  #messages { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .empty { margin: auto; text-align: center; color: var(--muted); font: italic 17px var(--serif); }
  .msg { max-width: 85%; padding: 11px 15px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); font-family: var(--serif); font-size: 16px; }
  .msg.assistant.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  .msg.system { align-self: center; background: transparent; color: var(--err); font-size: 13px; text-align: center; }
  .meta { display: block; font: 11px var(--sans); color: var(--muted); margin-top: 6px; }
  @keyframes blink { 50% { opacity: 0; } }

  form#composer { display: flex; gap: 10px; padding: 12px 0 18px; border-top: 1px solid var(--line); }
  form#composer textarea { resize: none; height: 46px; max-height: 160px; }
  @media (max-width: 560px) {
    .status { margin-left: 0; }
    .msg { max-width: 95%; }
  }
</style>
</head>
<body>
<header>
  <h1>JARVIS<small>console de test</small></h1>
  <div class="status" id="status">
    <span><i class="dot" id="st-redis"></i>Redis</span>
    <span><i class="dot" id="st-supabase"></i>Supabase</span>
    <span><i class="dot" id="st-openai"></i>OpenAI</span>
  </div>
</header>

<main>
  <section id="login" class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" id="tab-login" aria-selected="true">Connexion</button>
      <button type="button" role="tab" class="tab" id="tab-signup" aria-selected="false">Créer un compte</button>
    </div>

    <form id="login-form">
      <p>Connectez-vous avec un compte existant.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Se connecter</button>
      <div class="error" id="login-error"></div>
    </form>

    <form id="signup-form" hidden>
      <p>Le profil (palier Free : 30 messages et 50 000 tokens par jour) est créé automatiquement.</p>
      <label for="su-name">Nom affiché</label>
      <input id="su-name" type="text" autocomplete="name" maxlength="80">
      <label for="su-email">E-mail</label>
      <input id="su-email" type="email" autocomplete="email" required>
      <label for="su-password">Mot de passe (6 caractères minimum)</label>
      <input id="su-password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="su-password2">Confirmer le mot de passe</label>
      <input id="su-password2" type="password" autocomplete="new-password" minlength="6" required>
      <button type="submit" id="signup-btn">Créer le compte</button>
      <div class="error" id="signup-error"></div>
      <div class="notice" id="signup-notice"></div>
    </form>
  </section>

  <section id="chat">
    <div class="toolbar">
      <span id="who"></span>
      <label style="margin:0">Ton
        <select id="ton">
          <option value="naturel">Naturel</option>
          <option value="amical">Amical</option>
          <option value="professionnel">Professionnel</option>
          <option value="concis">Concis</option>
          <option value="pedagogue">Pédagogue</option>
          <option value="enthousiaste">Enthousiaste</option>
        </select>
      </label>
      <span class="grow"></span>
      <span class="quota" id="quota" title=""><span class="bar"><i id="quota-bar"></i></span><span id="quota-txt">–</span></span>
      <button class="ghost" id="new-conv" type="button">Nouvelle conversation</button>
      <button class="ghost" id="logout" type="button">Déconnexion</button>
    </div>
    <div class="conv" id="conv"></div>
    <div id="messages"><div class="empty" id="empty">Dites bonjour à JARVIS.</div></div>
    <form id="composer">
      <textarea id="input" placeholder="Votre message… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)" maxlength="8000"></textarea>
      <button type="submit" id="send">Envoyer</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let config = null;
let token = null;
let conversationId = null;
let busy = false;

// --- État des services ---------------------------------------------------------
async function loadStatus() {
  try {
    config = await (await fetch("/console/config")).json();
    setDot("st-openai", config.openai_configured ? "ok" : "err",
      config.openai_configured ? config.model : "OPENAI_API_KEY manquante dans .env");
  } catch { setDot("st-openai", "err", "config indisponible"); }
  try {
    const r = await (await fetch("/health/ready")).json();
    setDot("st-redis", r.redis === "ok" ? "ok" : "err", r.redis);
    setDot("st-supabase", r.supabase === "ok" ? "ok" : "err", r.supabase);
  } catch {
    setDot("st-redis", "err", "API injoignable");
    setDot("st-supabase", "err", "API injoignable");
  }
}
function setDot(id, cls, title) {
  const el = $(id); el.className = "dot " + cls; el.parentElement.title = title || "";
}

// --- Onglets ---------------------------------------------------------------------
function showTab(name) {
  const login = name === "login";
  $("tab-login").classList.toggle("active", login);
  $("tab-signup").classList.toggle("active", !login);
  $("tab-login").setAttribute("aria-selected", login);
  $("tab-signup").setAttribute("aria-selected", !login);
  $("login-form").hidden = !login;
  $("signup-form").hidden = login;
}
$("tab-login").addEventListener("click", () => showTab("login"));
$("tab-signup").addEventListener("click", () => showTab("signup"));

// --- Supabase Auth ---------------------------------------------------------------
async function authRequest(path, body) {
  if (!config || !config.publishable_key) {
    throw new Error("SUPABASE_PUBLISHABLE_KEY manquante dans backend/.env.");
  }
  const resp = await fetch(config.supabase_url + "/auth/v1/" + path, {
    method: "POST",
    headers: { "apikey": config.publishable_key, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(translateAuthError(data));
  return data;
}

function translateAuthError(data) {
  const code = data.error_code || data.code || "";
  const msg = data.msg || data.error_description || data.message || "Erreur d'authentification";
  const fr = {
    invalid_credentials: "E-mail ou mot de passe incorrect.",
    email_not_confirmed: "E-mail pas encore confirmé : cliquez sur le lien reçu par e-mail.",
    user_already_exists: "Un compte existe déjà avec cet e-mail : utilisez l'onglet Connexion.",
    weak_password: "Mot de passe trop faible.",
    over_email_send_rate_limit: "Trop d'e-mails envoyés : réessayez dans quelques minutes.",
    signup_disabled: "Les inscriptions sont désactivées dans Supabase.",
    validation_failed: "E-mail invalide.",
  };
  return fr[code] || msg;
}

function startSession(session) {
  token = session.access_token;
  $("password").value = ""; $("su-password").value = ""; $("su-password2").value = "";
  $("who").textContent = session.user && session.user.email ? session.user.email : "";
  $("login").style.display = "none";
  $("chat").style.display = "flex";
  $("input").focus();
  refreshQuota();
}

// --- Connexion -------------------------------------------------------------------
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").textContent = "";
  $("login-btn").disabled = true;
  try {
    startSession(await authRequest("token?grant_type=password", {
      email: $("email").value.trim(), password: $("password").value,
    }));
  } catch (err) {
    $("login-error").textContent = err.message;
  } finally {
    $("login-btn").disabled = false;
  }
});

// --- Création de compte ----------------------------------------------------------
$("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("signup-error").textContent = ""; $("signup-notice").textContent = "";
  if ($("su-password").value !== $("su-password2").value) {
    $("signup-error").textContent = "Les deux mots de passe ne correspondent pas.";
    return;
  }
  const email = $("su-email").value.trim();
  const name = $("su-name").value.trim();
  $("signup-btn").disabled = true;
  try {
    const data = await authRequest("signup", {
      email, password: $("su-password").value,
      data: name ? { display_name: name } : {},
    });
    if (data.access_token) {
      // Confirmation par e-mail désactivée : session immédiate.
      startSession(data);
      return;
    }
    // Confirmation par e-mail activée (réglage par défaut de Supabase).
    $("su-password").value = ""; $("su-password2").value = "";
    $("email").value = email;
    $("signup-notice").textContent =
      "Compte créé. Un e-mail de confirmation a été envoyé à " + email + ".\n"
      + "Cliquez sur le lien qu'il contient, puis connectez-vous dans l'onglet Connexion.\n\n"
      + "Aucun e-mail ? Vérifiez les spams, ou désactivez la confirmation pour vos tests "
      + "(Supabase → Authentication → Sign In / Providers → Email → « Confirm email »).";
  } catch (err) {
    $("signup-error").textContent = err.message;
  } finally {
    $("signup-btn").disabled = false;
  }
});

$("logout").addEventListener("click", () => {
  token = null; conversationId = null;
  $("chat").style.display = "none"; $("login").style.display = "";
  resetMessages();
});

$("new-conv").addEventListener("click", () => { conversationId = null; resetMessages(); $("input").focus(); });

function resetMessages() {
  $("messages").innerHTML = '<div class="empty" id="empty">Dites bonjour à JARVIS.</div>';
  $("conv").textContent = "";
}

// --- Quota ---------------------------------------------------------------------
async function refreshQuota() {
  const r = await api("/me/quota");
  if (r.ok) { showQuota(await r.json()); return; }
  let detail = "Erreur " + r.status;
  try { detail = (await r.json()).detail || detail; } catch {}
  addMessage("system", "Quota indisponible : " + detail);
}
function showQuota(q) {
  if (!q) return;
  const ratio = (used, limit) => limit == null ? 0 : Math.min(1, used / Math.max(1, limit));
  const r = Math.max(ratio(q.messages_used, q.messages_limit), ratio(q.tokens_used, q.tokens_limit));
  const unlimited = q.messages_limit == null && q.tokens_limit == null;
  const bar = $("quota-bar");
  bar.style.width = (r * 100) + "%";
  bar.style.background = r >= 1 ? "var(--err)" : r >= .8 ? "var(--warn)" : "var(--muted)";
  $("quota-txt").textContent = unlimited ? "illimité"
    : q.messages_limit != null ? `${q.messages_used}/${q.messages_limit} messages` : `${Math.round(r * 100)} %`;
  const h = Math.floor(q.resets_in / 3600), m = Math.floor(q.resets_in % 3600 / 60);
  $("quota").title = `Palier ${q.plan}\nMessages : ${q.messages_used}${q.messages_limit != null ? " / " + q.messages_limit : ""}`
    + `\nTokens : ${q.tokens_used.toLocaleString("fr-FR")}${q.tokens_limit != null ? " / " + q.tokens_limit.toLocaleString("fr-FR") : ""}`
    + `\nRéinitialisation dans ${h} h ${String(m).padStart(2, "0")}`;
}

function api(path, options = {}) {
  return fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: "Bearer " + token } });
}

// --- Messages ------------------------------------------------------------------
function addMessage(role, text) {
  const empty = $("empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("messages").appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}
function addMeta(el, text) {
  const meta = document.createElement("span");
  meta.className = "meta"; meta.textContent = text;
  el.appendChild(meta);
}

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = $("input").value.trim();
  if (!message || busy) return;
  busy = true; $("send").disabled = true;
  $("input").value = "";
  addMessage("user", message);
  const bubble = addMessage("assistant", "");
  bubble.classList.add("streaming");
  let text = "";
  const started = performance.now();

  try {
    const resp = await api("/api/v1/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, ton: $("ton").value, ...(conversationId ? { conversation_id: conversationId } : {}) }),
    });

    if (!resp.ok) {
      let detail = {};
      try { detail = (await resp.json()).detail; } catch {}
      if (detail && detail.quota) showQuota(detail.quota);
      const msg = typeof detail === "string" ? detail : (detail && detail.message) || "Erreur " + resp.status;
      bubble.remove();
      addMessage("system", resp.status === 401 ? msg + " — reconnectez-vous." : msg);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let i;
      while ((i = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, i); buffer = buffer.slice(i + 2);
        let event = "", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === "meta") {
          conversationId = payload.conversation_id;
          $("conv").textContent = "conversation " + conversationId;
          showQuota(payload.quota);
        } else if (event === "delta") {
          text += payload.text;
          bubble.textContent = text;
          bubble.scrollIntoView({ block: "end" });
        } else if (event === "done") {
          showQuota(payload.quota);
          bubble.classList.remove("streaming");
          addMeta(bubble, `${payload.usage.total_tokens} tokens · ${((performance.now() - started) / 1000).toFixed(1)} s`);
        } else if (event === "error") {
          bubble.classList.remove("streaming");
          if (!text) bubble.remove();
          addMessage("system", payload.message);
        }
      }
    }
  } catch (err) {
    addMessage("system", "Connexion interrompue : " + err.message);
  } finally {
    bubble.classList.remove("streaming");
    if (!bubble.textContent && bubble.isConnected) bubble.remove();
    busy = false; $("send").disabled = false; $("input").focus();
  }
});

loadStatus();
setInterval(loadStatus, 15000);
</script>
</body>
</html>
